name: Build ConnectTool
on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  BUILD_TYPE: Release
  BOOST_VERSION: "1.84.0"
  QT_VERSION: "6.11.1"
  AQT_SOURCE: "git+https://github.com/miurahr/aqtinstall.git@5be32a75a81513792d95f13065b72cac3381c612"
jobs:
  build:
    runs-on: windows-latest
    name: Build (Windows)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "${{ env.QT_VERSION }}"
          arch: win64_msvc2022_64
          modules: qtshadertools qttasktree
          aqtsource: "${{ env.AQT_SOURCE }}"
          cache: true
      - name: Install pkg-config
        shell: pwsh
        run: choco install pkgconfiglite --version=0.28 --yes --no-progress
      - name: Download Boost headers
        shell: pwsh
        run: |
          $boostVersion = $env:BOOST_VERSION
          $boostVersionUnderscore = $boostVersion -replace '\.', '_'
          $boostUrl = "https://archives.boost.io/release/$boostVersion/source/boost_${boostVersionUnderscore}.tar.gz"
          $dest = Join-Path $env:GITHUB_WORKSPACE ".cache\\boost"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $archive = Join-Path $dest "boost_${boostVersionUnderscore}.tar.gz"
          Invoke-WebRequest -Uri $boostUrl -OutFile $archive
          tar -xf $archive -C $dest
          $boostRoot = Join-Path $dest "boost_${boostVersionUnderscore}"
          Add-Content -Path $env:GITHUB_ENV -Value "BOOST_ROOT=$boostRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "BOOST_INCLUDEDIR=$boostRoot"
      - name: Download Steamworks SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_URL="${{ secrets.STEAMWORKS_SDK_URL }}"
          if [[ -z "$SDK_URL" ]]; then
            echo "::error::STEAMWORKS_SDK_URL secret not set"
            exit 1
          fi
          rm -rf steamworks steamworks_temp steamworks_sdk.zip
          curl -fSLo steamworks_sdk.zip "$SDK_URL"
          unzip -q steamworks_sdk.zip -d steamworks_temp
          mkdir -p steamworks
          if [[ -d "steamworks_temp/sdk" ]]; then
            cp -R steamworks_temp/sdk/. steamworks/
          else
            cp -R steamworks_temp/. steamworks/
          fi
          rm -rf steamworks_sdk.zip steamworks_temp
      - name: Verify Steamworks SDK
        shell: pwsh
        run: |
          $header = Join-Path $PWD "steamworks/public/steam/steam_api.h"
          if (-not (Test-Path $header)) {
            throw "Steamworks SDK headers not found at $header"
          }
          $lib = Join-Path $PWD "steamworks/redistributable_bin/win64/steam_api64.dll"
          if (-not (Test-Path $lib)) {
            throw "Steamworks redistributable not found at $lib"
          }
      - name: Configure CMake
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Validate QML
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target connecttool-qt_qmllint
      - name: Test
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure
      - name: Install
        run: cmake --install build --config ${{ env.BUILD_TYPE }} --prefix "${{ github.workspace }}/install"
      - name: Deploy Qt runtime (Windows)
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE 'install'
          $qtCMakeDir = $env:Qt6_DIR
          $candidateBins = @()
          if ($qtCMakeDir) {
            $candidateBins += [IO.Path]::GetFullPath((Join-Path $qtCMakeDir '..\..\..\bin'))
            $candidateBins += [IO.Path]::GetFullPath((Join-Path $qtCMakeDir '..\..\..\..\bin'))
          }
          $candidateBins += $env:PATH.Split([IO.Path]::PathSeparator)
          $windeploy = $null
          foreach ($binDir in $candidateBins) {
            if (-not $binDir) { continue }
            $exe = Join-Path $binDir 'windeployqt.exe'
            if (Test-Path $exe) {
              $windeploy = $exe
              break
            }
          }
          if (-not $windeploy) {
            $cmd = Get-Command windeployqt.exe -ErrorAction SilentlyContinue
            if ($cmd) {
              $windeploy = $cmd.Source
            }
          }
          if (-not $windeploy) {
            throw "Unable to locate windeployqt.exe. Checked Qt6_DIR and PATH."
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "Unable to locate vswhere.exe."
          }
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) {
            throw "Unable to locate the Visual C++ toolchain."
          }
          $env:VCINSTALLDIR = Join-Path $vsInstall 'VC'
          $projectDir = (Get-Location).ProviderPath
          $runtime = Join-Path $dest 'bin\runtime'
          & $windeploy --release --no-compiler-runtime --no-translations `
            --skip-plugin-types generic,networkinformation,qmltooling `
            --exclude-plugins qcertonlybackend,qgif,qico,qjpeg,qopensslbackend `
            --dir "$dest\bin" `
            --plugindir "$runtime\plugins" `
            --qml-deploy-dir "$runtime\qml" `
            --qmldir "$projectDir\qml" `
            "$dest\bin\connecttool-qt.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }
          $crtDirectory = Get-ChildItem -Path (Join-Path $env:VCINSTALLDIR 'Redist\MSVC') -Recurse -Directory |
            Where-Object { $_.Name -like 'Microsoft.VC*.CRT' -and $_.FullName -match '[\\/]x64[\\/]' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $crtDirectory) {
            throw "Unable to locate the x64 application-local Visual C++ runtime."
          }
          Copy-Item (Join-Path $crtDirectory.FullName '*.dll') -Destination (Join-Path $dest 'bin') -Force
      - name: Flatten Windows bundle layout
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ github.workspace }}/install"
          RUNTIME="$DEST/runtime"
          mkdir -p "$RUNTIME"
          if [[ -d "$DEST/bin" ]]; then
            shopt -s nullglob
            for entry in "$DEST"/bin/*; do
              mv "$entry" "$DEST/"
            done
            rmdir "$DEST/bin"
          fi
          if [[ -d "$DEST/qml" ]]; then
            rm -rf "${RUNTIME:?}/qml"
            mv "$DEST/qml" "$RUNTIME/"
          elif [[ -d "$DEST/lib/qt-6/qml" ]]; then
            mkdir -p "$RUNTIME/qml"
            cp -R "$DEST/lib/qt-6/qml"/. "$RUNTIME/qml/"
          fi
          if [[ -d "$DEST/plugins" ]]; then
            rm -rf "${RUNTIME:?}/plugins"
            mv "$DEST/plugins" "$RUNTIME/"
          elif [[ -d "$DEST/lib/qt-6/plugins" ]]; then
            rm -rf "${RUNTIME:?}/plugins"
            cp -R "$DEST/lib/qt-6/plugins" "$RUNTIME/plugins"
          fi
          shopt -s nullglob
          for dll in "$DEST"/lib/*.dll; do
            mv "$dll" "$DEST/"
          done
          rm -rf "${DEST:?}/lib"
          find "$RUNTIME/qml" -type f -name '*.qmltypes' -delete
          DOCS="$DEST/share/doc/connecttool-qt"
          if [[ -d "$DOCS" ]]; then
            mkdir -p "$DEST/licenses"
            mv "$DOCS/LICENSE-NotoSansCJK.txt" "$DEST/licenses/NotoSansCJK-OFL.txt"
            mv "$DOCS/THIRD_PARTY_NOTICES.md" "$DEST/licenses/THIRD_PARTY_NOTICES.md"
            mv "$DOCS/licenses/QmlMaterial-MIT.txt" "$DEST/licenses/QmlMaterial-MIT.txt"
            mv "$DOCS/licenses/Apache-2.0.txt" "$DEST/licenses/Apache-2.0.txt"
            rm -rf "${DEST:?}/share"
          fi
          cp packaging/windows/README.txt "$DEST/README.txt"
          cat > "$DEST/qt.conf" <<'EOF'
          [Paths]
          Prefix = .
          Binaries = .
          Libraries = .
          Plugins = runtime/plugins
          QmlImports = runtime/qml
          EOF
      - name: Verify deployed Windows layout
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE 'install'
          $required = @(
            'connecttool-qt.exe',
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6LabsPlatform.dll',
            'Qt6Network.dll',
            'Qt6OpenGL.dll',
            'Qt6Qml.dll',
            'Qt6QmlMeta.dll',
            'Qt6QmlModels.dll',
            'Qt6QmlWorkerScript.dll',
            'Qt6Quick.dll',
            'Qt6QuickControls2.dll',
            'Qt6QuickLayouts.dll',
            'Qt6QuickTemplates2.dll',
            'Qt6Svg.dll',
            'Qt6Widgets.dll',
            'D3Dcompiler_47.dll',
            'opengl32sw.dll',
            'steam_api64.dll',
            'steamwebrtc64.dll',
            'runtime\plugins\platforms\qwindows.dll',
            'runtime\plugins\imageformats\qsvg.dll',
            'runtime\plugins\styles\qmodernwindowsstyle.dll',
            'runtime\plugins\tls\qschannelbackend.dll',
            'runtime\qml\QtQuick\qtquick2plugin.dll',
            'MSVCP140.dll',
            'MSVCP140_ATOMIC_WAIT.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll',
            'README.txt',
            'licenses\NotoSansCJK-OFL.txt',
            'licenses\THIRD_PARTY_NOTICES.md',
            'qt.conf'
          )
          foreach ($relativePath in $required) {
            $path = Join-Path $dest $relativePath
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required Windows runtime file is missing: $relativePath"
            }
          }
          foreach ($unexpected in @('platforms', 'imageformats', 'styles', 'tls')) {
            if (Test-Path (Join-Path $dest $unexpected)) {
              throw "Qt plugin directory was deployed outside runtime/plugins: $unexpected"
            }
          }
          $forbidden = @(
            'runtime\plugins\generic',
            'runtime\plugins\networkinformation',
            'runtime\plugins\qmltooling',
            'runtime\plugins\tls\qcertonlybackend.dll',
            'runtime\plugins\tls\qopensslbackend.dll',
            'runtime\translations',
            'share',
            'vc_redist.x64.exe',
            'ConnectTool-Safe-Mode.cmd'
          )
          foreach ($relativePath in $forbidden) {
            if (Test-Path (Join-Path $dest $relativePath)) {
              throw "Unneeded Windows runtime content was packaged: $relativePath"
            }
          }
          $typeDescriptions = Get-ChildItem -Path (Join-Path $dest 'runtime\qml') -Recurse -Filter '*.qmltypes'
          if ($typeDescriptions) {
            throw "QML tooling metadata was packaged: $($typeDescriptions.FullName -join ', ')"
          }
      - name: Bundle Wintun runtime (Windows)
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE 'install'
          $tmp = Join-Path $env:RUNNER_TEMP 'wintun'
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $dll = Get-ChildItem -Path $tmp -Recurse -Filter 'wintun.dll' | Where-Object { $_.FullName -match 'amd64|x64' } | Select-Object -First 1
          if (-not $dll) {
            throw "wintun.dll not found in downloaded archive"
          }
          Copy-Item $dll.FullName -Destination (Join-Path $dest 'wintun.dll') -Force
      - name: Render-test deployed Windows bundle
        shell: pwsh
        run: |
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $env:QSG_INFO = '1'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'install\connecttool-qt.exe'
          $screenshot = Join-Path $env:RUNNER_TEMP 'connecttool-render-test.png'
          $log = Join-Path $env:RUNNER_TEMP 'connecttool-render-test.log'
          $arguments = @(
            "--qml-screenshot=$screenshot",
            '--windows-uia-probe',
            "--log-file=$log"
          )
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          if (Test-Path $log) {
            Get-Content $log
          }
          if ($process.ExitCode -ne 0) {
            throw "Deployed Windows render test failed with exit code $($process.ExitCode)"
          }
          if (-not (Test-Path $screenshot -PathType Leaf) -or (Get-Item $screenshot).Length -eq 0) {
            throw "Deployed Windows render test did not produce a screenshot"
          }
          if (-not (Select-String -Path $log -Pattern 'Renderer preference: automatic')) {
            throw "Deployed Windows render test did not use automatic renderer selection"
          }
          if (-not (Select-String -Path $log -Pattern 'graphics API 4')) {
            throw "The compatible path did not retain the normal D3D11 renderer"
          }
          $fallbackScreenshot = Join-Path $env:RUNNER_TEMP 'connecttool-fallback-render-test.png'
          $fallbackLog = Join-Path $env:RUNNER_TEMP 'connecttool-fallback-render-test.log'
          $fallbackProcess = Start-Process -FilePath $exe -ArgumentList @(
            '--simulate-renderer-startup-failure',
            "--qml-screenshot=$fallbackScreenshot",
            "--log-file=$fallbackLog"
          ) -Wait -PassThru
          if (Test-Path $fallbackLog) {
            Get-Content $fallbackLog
          }
          if ($fallbackProcess.ExitCode -ne 0) {
            throw "Automatic renderer fallback failed with exit code $($fallbackProcess.ExitCode)"
          }
          if (-not (Test-Path $fallbackScreenshot -PathType Leaf) -or
              (Get-Item $fallbackScreenshot).Length -eq 0) {
            throw "Automatic software fallback did not produce a screenshot"
          }
          if (-not (Select-String -Path $fallbackLog -Pattern 'Renderer preference: software')) {
            throw "Automatic renderer fallback did not select the software backend"
          }
          if (-not (Select-String -Path $fallbackLog -Pattern 'graphics API 1')) {
            throw "Automatic renderer fallback did not initialize Qt's software scene graph"
          }
      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_NAME="connecttool-qt-windows-x86_64"
          DEST="dist/$ARTIFACT_NAME"
          mkdir -p "$DEST"
          cp -R "${{ github.workspace }}/install"/. "$DEST/"
          echo "artifact_dir=$DEST" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: connecttool-qt-windows-x86_64
          path: ${{ steps.package.outputs.artifact_dir }}
          if-no-files-found: error
  build-macos:
    runs-on: macos-15-intel
    name: Build (macOS)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "${{ env.QT_VERSION }}"
          arch: clang_64
          modules: qtshadertools qttasktree
          aqtsource: "${{ env.AQT_SOURCE }}"
          cache: true
      - name: Download Boost headers
        shell: bash
        run: |
          set -euo pipefail
          BOOST_VERSION_UNDERSCORE="${BOOST_VERSION//./_}"
          BOOST_URL="https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION_UNDERSCORE}.tar.gz"
          DEST="$PWD/.cache/boost"
          mkdir -p "$DEST"
          curl -fSLo "$DEST/boost_${BOOST_VERSION_UNDERSCORE}.tar.gz" "$BOOST_URL"
          tar -xf "$DEST/boost_${BOOST_VERSION_UNDERSCORE}.tar.gz" -C "$DEST"
          BOOST_ROOT="$DEST/boost_${BOOST_VERSION_UNDERSCORE}"
          echo "BOOST_ROOT=$BOOST_ROOT" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDEDIR=$BOOST_ROOT" >> "$GITHUB_ENV"
      - name: Download Steamworks SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_URL="${{ secrets.STEAMWORKS_SDK_URL }}"
          if [[ -z "$SDK_URL" ]]; then
            echo "::error::STEAMWORKS_SDK_URL secret not set"
            exit 1
          fi
          rm -rf steamworks steamworks_temp steamworks_sdk.zip
          curl -fSLo steamworks_sdk.zip "$SDK_URL"
          unzip -q steamworks_sdk.zip -d steamworks_temp
          mkdir -p steamworks
          if [[ -d "steamworks_temp/sdk" ]]; then
            cp -R steamworks_temp/sdk/. steamworks/
          else
            cp -R steamworks_temp/. steamworks/
          fi
          rm -rf steamworks_sdk.zip steamworks_temp
      - name: Verify Steamworks SDK
        shell: bash
        run: |
          set -euo pipefail
          header="steamworks/public/steam/steam_api.h"
          if [[ ! -f "$header" ]]; then
            echo "::error::Steamworks SDK headers not found at $header"
            exit 1
          fi
          lib="steamworks/redistributable_bin/osx/libsteam_api.dylib"
          if [[ ! -f "$lib" ]]; then
            echo "::error::Steamworks redistributable not found at $lib"
            exit 1
          fi
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Validate QML
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target connecttool-qt_qmllint
      - name: Test
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure
      - name: Deploy Qt runtime (macOS)
        shell: bash
        run: |
          set -euo pipefail
          macdeployqt "build/connecttool-qt.app" \
            -qmldir="${{ github.workspace }}/qml" \
            -verbose=2
      - name: Prune unused Qt runtime (macOS)
        shell: bash
        run: scripts/package/prune_macos_bundle.sh "build/connecttool-qt.app"
      - name: Bundle Steamworks dylibs (macOS)
        shell: bash
        run: |
          set -euo pipefail
          app="build/connecttool-qt.app"
          frameworks_dir="$app/Contents/Frameworks"
          sdk_dir="${{ github.workspace }}/steamworks/redistributable_bin/osx"
          if [[ ! -d "$app/Contents" ]]; then
            echo "::error::Missing app bundle at $app"
            exit 1
          fi
          if [[ ! -f "$sdk_dir/libsteam_api.dylib" ]]; then
            echo "::error::Missing Steamworks libsteam_api.dylib in $sdk_dir"
            exit 1
          fi
          mkdir -p "$frameworks_dir"
          cp -f "$sdk_dir/libsteam_api.dylib" "$frameworks_dir/"
          if [[ -f "$sdk_dir/libsteamwebrtc.dylib" ]]; then
            cp -f "$sdk_dir/libsteamwebrtc.dylib" "$frameworks_dir/"
          fi
          bin="$app/Contents/MacOS/connecttool-qt"
          if [[ -x "$app/Contents/MacOS/.connecttool-qt-wrapped" ]]; then
            bin="$app/Contents/MacOS/.connecttool-qt-wrapped"
          fi
          fix_deps() {
            local lib="$1"
            local lib_path="$frameworks_dir/$lib"
            if [[ ! -f "$lib_path" ]]; then
              return
            fi
            install_name_tool -id "@loader_path/../Frameworks/$lib" "$lib_path" || true
            while read -r dep _; do
              if [[ "$dep" == *"$lib" ]]; then
                install_name_tool -change "$dep" "@loader_path/../Frameworks/$lib" "$bin" || true
              fi
            done < <(otool -L "$bin" | tail -n +2)
          }
          fix_deps "libsteam_api.dylib"
          fix_deps "libsteamwebrtc.dylib"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
      - name: Verify deployed macOS bundle
        shell: bash
        run: |
          set -euo pipefail
          app="build/connecttool-qt.app"
          scripts/package/verify_macos_bundle.sh "$app"
          screenshot="${RUNNER_TEMP}/connecttool-macos-render.png"
          log="${RUNNER_TEMP}/connecttool-macos-render.log"
          "$app/Contents/MacOS/connecttool-qt" \
            "--qml-screenshot=$screenshot" \
            "--log-file=$log"
          cat "$log"
          test -s "$screenshot"
      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg_dir="$(mktemp -d "${RUNNER_TEMP}/connecttool-dmg.XXXXXX")"
          dmg_path="${{ github.workspace }}/dist/connecttool-qt-macos-x86_64.dmg"
          rm -f "$dmg_path"
          mkdir -p "$(dirname "$dmg_path")"
          cp -R "build/connecttool-qt.app" "$dmg_dir/"
          ln -s /Applications "$dmg_dir/Applications"
          hdiutil create \
            -volname "ConnectTool" \
            -srcfolder "$dmg_dir" \
            -ov -format UDZO -fs HFS+ \
            "$dmg_path"
          rm -rf "$dmg_dir"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: connecttool-qt-macos-x86_64
          path: dist/connecttool-qt-macos-x86_64.dmg
          if-no-files-found: error
  build-appimage:
    runs-on: ubuntu-latest
    name: Build (Linux AppImage)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            patchelf \
            libsdl2-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-cursor0 \
            libxrender1 \
            libxi6 \
            libwayland-client0 \
            libwayland-egl1 \
            libwayland-cursor0 \
            libwayland-server0 \
            libfuse2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "${{ env.QT_VERSION }}"
          arch: linux_gcc_64
          modules: qtshadertools qttasktree qtwaylandcompositor
          aqtsource: "${{ env.AQT_SOURCE }}"
          cache: true
      - name: Download Boost headers
        shell: bash
        run: |
          set -euo pipefail
          BOOST_VERSION_UNDERSCORE="${BOOST_VERSION//./_}"
          BOOST_URL="https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION_UNDERSCORE}.tar.gz"
          DEST="$PWD/.cache/boost"
          mkdir -p "$DEST"
          curl -fSLo "$DEST/boost_${BOOST_VERSION_UNDERSCORE}.tar.gz" "$BOOST_URL"
          tar -xf "$DEST/boost_${BOOST_VERSION_UNDERSCORE}.tar.gz" -C "$DEST"
          BOOST_ROOT="$DEST/boost_${BOOST_VERSION_UNDERSCORE}"
          echo "BOOST_ROOT=$BOOST_ROOT" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDEDIR=$BOOST_ROOT" >> "$GITHUB_ENV"
      - name: Download Steamworks SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_URL="${{ secrets.STEAMWORKS_SDK_URL }}"
          if [[ -z "$SDK_URL" ]]; then
            echo "::error::STEAMWORKS_SDK_URL secret not set"
            exit 1
          fi
          rm -rf steamworks steamworks_temp steamworks_sdk.zip
          curl -fSLo steamworks_sdk.zip "$SDK_URL"
          unzip -q steamworks_sdk.zip -d steamworks_temp
          mkdir -p steamworks
          if [[ -d "steamworks_temp/sdk" ]]; then
            cp -R steamworks_temp/sdk/. steamworks/
          else
            cp -R steamworks_temp/. steamworks/
          fi
          rm -rf steamworks_sdk.zip steamworks_temp
      - name: Verify Steamworks SDK
        shell: bash
        run: |
          set -euo pipefail
          header="steamworks/public/steam/steam_api.h"
          if [[ ! -f "$header" ]]; then
            echo "::error::Steamworks SDK headers not found at $header"
            exit 1
          fi
          lib="steamworks/redistributable_bin/linux64/libsteam_api.so"
          if [[ ! -f "$lib" ]]; then
            echo "::error::Steamworks redistributable not found at $lib"
            exit 1
          fi
      - name: Configure CMake (Linux)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build (Linux)
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Validate QML
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target connecttool-qt_qmllint
      - name: Test
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure
      - name: Install (Linux)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppDir
          DESTDIR="$PWD/AppDir" cmake --install build --config ${{ env.BUILD_TYPE }}
      - name: Install linuxdeploy
        uses: pcolby/install-linuxdeploy@v1
        with:
          plugins: qt appimage
      - name: Build AppImage
        shell: bash
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          EXTRA_QT_MODULES: waylandcompositor
          EXTRA_PLATFORM_PLUGINS: libqwayland.so
        run: |
          set -euo pipefail
          appdir="${{ github.workspace }}/AppDir"
          linuxdeploy="${{ runner.temp }}/linuxdeploy/linuxdeploy-x86_64.AppImage"
          "$linuxdeploy" --appdir "$appdir" --plugin qt --output appimage \
            --desktop-file "${{ github.workspace }}/resources/connecttool.desktop" \
            --icon-file "${{ github.workspace }}/resources/connecttool-qt.png"
      - name: Collect AppImage
        id: package
        shell: bash
        run: |
          set -euo pipefail
          appimage=("${{ github.workspace }}"/*.AppImage)
          if (( ${#appimage[@]} == 0 )); then
            echo "::error::No AppImage produced in workspace"
            exit 1
          fi
          mkdir -p dist
          cp "${appimage[0]}" dist/connecttool-qt-linux-x86_64.AppImage
          echo "artifact_path=dist/connecttool-qt-linux-x86_64.AppImage" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: connecttool-qt-linux-x86_64
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
  release:
    name: Publish Release
    needs: [build, build-macos, build-appimage]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Create release archives
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in dist/*; do
            if [[ -d "$dir" ]]; then
              dmg_files=("$dir"/*.dmg)
              if (( ${#dmg_files[@]} )); then
                continue
              fi
              appimage_files=("$dir"/*.AppImage)
              if (( ${#appimage_files[@]} )); then
                continue
              fi
              name="$(basename "$dir")"
              cmake -E chdir dist cmake -E tar cf "${name}.zip" --format=zip "$name"
            fi
          done
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ contains(github.ref_name, '-alpha') && 'alpha' || github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha') }}
          make_latest: ${{ contains(github.ref_name, '-alpha') && 'false' || 'legacy' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.zip
            dist/**/*.dmg
            dist/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
